spring:
  autoconfigure:
    exclude:
      # Google GenAI starter fails at startup when no API key is configured (unlike other
      # providers which validate lazily). Exclude it here; to enable Google Gemini models,
      # remove this exclusion and set GOOGLE_API_KEY env var (or configure in YAML).
      - com.embabel.agent.autoconfigure.models.googlegenai.AgentGoogleGenAiAutoConfiguration
  shell:
    noninteractive:
      exit-on-error: true   # exit the process when a command fails (e.g. LLM timeout)

embabel:
  agent:
    platform:
      llm-operations:
        prompts:
          default-timeout: 300s    # wait up to 5 minutes for slow local LLMs (was silently ignored before)
        data-binding:
          max-attempts: 2          # reduce retries to avoid flooding LM Studio
          fixed-backoff-millis: 2000

      models:
        # Google Gemini — set GOOGLE_API_KEY env var to enable (no YAML entry needed;
        # Embabel picks up GOOGLE_API_KEY automatically when the var is present)

        # LM Studio — dynamically discovers loaded models at startup
        lmstudio:
          base-url: ${LMSTUDIO_BASE_URL:http://localhost:1234}

        # OpenAI (ChatGPT) — set OPENAI_API_KEY env var to enable
        openai:
          api-key: ${OPENAI_API_KEY:}

        # Anthropic (Claude) — set ANTHROPIC_API_KEY env var or add your key as default
        anthropic:
          api-key: ${ANTHROPIC_API_KEY:}

  models:
    # ── Switch provider by changing this one line (or set LOCAL_LLM_MODEL env var) ──
    # LM Studio:  qwen/qwen3-coder-next | qwen/qwen2.5-coder-14b | openai/gpt-oss-120b  (auto-discovered from local server)
    # OpenAI:     gpt-4o-mini | gpt-4.1 | gpt-4.1-mini
    # Google:     gemini-2.0-flash | gemini-2.5-flash | gemini-2.5-pro
    # Anthropic:  claude-haiku-4-5 | claude-sonnet-4-5 | claude-opus-4-1
    default-llm: ${LOCAL_LLM_MODEL:mistralai/ministral-3-14b-reasoning}

code-review:
  chunk-size: 40000           # chars per MAP chunk — larger chunks = fewer LLM calls (qwen3-coder-next handles 32k+ tokens)
  max-files: 50               # max source files to ingest per run
  max-file-size-bytes: 50000  # skip files larger than this
  concurrency: 4              # max parallel LLM requests for MAP phase
  batch-threshold: 20000      # files smaller than this (chars) get batched into a single LLM call

invoice-extraction:
  max-pdf-size-bytes: 10000000  # max PDF file size (10MB)
  extraction-timeout: 300       # timeout for LLM extraction in seconds
  enable-ocr: false             # OCR support for scanned PDFs (not yet implemented)

zone-extraction:
  confidence-threshold: 0.4     # minimum confidence for zone extraction (lowered due to better OCR)
  high-confidence-threshold: 0.75  # threshold for high confidence
  ocr-dpi: 300.0                # DPI for OCR rendering
  ocr-psm-mode: 11              # Tesseract PSM mode (11 = sparse text for word detection)
  
  # Image preprocessing to improve OCR quality
  preprocessing-enabled: true
  preprocessing-steps: [DENOISE, ENHANCE_CONTRAST]
  denoise-strength: 2
  contrast-factor: 2.0
  
  # Fuzzy matching for label detection with OCR errors
  fuzzy-matching-enabled: true
  similarity-threshold: 0.8
  
  # Multi-pass OCR strategy (disabled - causes text merging issues)
  multi-pass-ocr-enabled: false
  max-passes: 2
  
  patterns:
    customer-number:
      labels:
        - "0101431"
        - "91471431"
        - "SHIP"
        - "S H I P"
        - "Ship"
        - "SHIPTO"
        - "SHIP TO"
        - "H I P"
        - "Customer Number"
        - "Cust No"
      strategy: BELOW
      max-distance: 100
    order-number:
      labels:
        - "INVOICE NO."
        - "INVOICE NO"
        - "Invoice No."
        - "Invoice No"
        - "Order No"
        - "Doc No"
      strategy: BELOW
      max-distance: 80
    line-number:
      labels:
        - "0001"
        - "LINE"
        - "Line"
        - "L I N E"
        - "LINE NO"
        - "Line No"
        - "ITEM"
        - "Item No"
      strategy: TABLE_COLUMN
      max-distance: 100
